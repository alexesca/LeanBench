[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leanbench"
version = "0.1.0"
description = "LeanBench — local-first benchmark for repository-intelligence systems"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "typer>=0.9",
    "psutil>=5.9",
]

[project.optional-dependencies]
tokenizers = ["tiktoken>=0.5"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
leanbench = "leanbench.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
leanbench = ["config/*.toml"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:leanbench.*"]
