[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leanbench-baselines"
version = "0.1.0"
description = "LeanBench reference baselines: RawRepository, Ripgrep, CTags, MinimalAST"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
minast = ["tree-sitter>=0.21", "tree-sitter-python>=0.21"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
