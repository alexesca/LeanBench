[pytest]
# One test root for the whole workspace. `pythonpath` covers the three packages plus the
# repository root (LeanVFS is imported as a top-level package), so no editable install
# is required to run the suite from a clean clone.
testpaths = leanbench/tests baselines/tests leanvfs/tests
pythonpath = . leanbench/src leanbench/tests baselines/src
addopts = -q --strict-markers
filterwarnings =
    error::DeprecationWarning:leanbench.*
