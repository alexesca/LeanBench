[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leanbench-baselines"
version = "0.1.0"
description = "LeanBench reference baselines: RawRepository, Ripgrep, CTags, MinimalAST"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
minast = ["tree-sitter>=0.21", "tree-sitter-python>=0.21"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RET", "ARG", "PTH", "E722", "T20"]
ignore = ["B008", "SIM108", "RET504"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
