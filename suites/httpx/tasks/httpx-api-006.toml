id            = "httpx-api-006"
version       = 1
repository    = "httpx"
commit        = "b5addb64f0161ff6bfe94c124ef76f6a1fba5254"
category      = "api_contract"
difficulty    = "L2"
authored_by   = "claude-opus-5"
reviewed_by   = ""
authored_at   = "2026-09-02"
tags          = ["urls", "immutability"]

# --- Agent Track ---------------------------------------------------------
prompt = """
Query parameters are immutable. What happens if you assign an item or call the mutating
method inherited from the mapping interface, what is the prescribed replacement, and
which tests pin that behaviour?
"""

required_capabilities = ["search", "symbols", "tests"]
allowed_tools         = ["candidate.search", "candidate.context", "repo.read_range", "repo.search"]

# --- Retrieval Track -----------------------------------------------------
[[probes]]
paraphrase_id = "literal"
op            = "search"
args          = { query = "QueryParams immutable update __setitem__ RuntimeError set merge", limit = 10 }

[[probes]]
paraphrase_id = "intent"
op            = "search"
args          = { query = "how do I change one query value on an existing parameter collection", limit = 10 }

[[probes]]
paraphrase_id = "symptom"
op            = "search"
args          = { query = "RuntimeError tells me these are immutable since 0.18.0 and to create an updated copy", limit = 10 }

# --- Structured gold -----------------------------------------------------
[gold]
files         = ["httpx/_urls.py"]
symbols       = ["QueryParams.update", "QueryParams.__setitem__", "QueryParams.set", "QueryParams.merge"]
tests         = ["tests/models/test_queryparams.py"]
ranges        = [{ path = "httpx/_urls.py", start = 631, end = 641 }, { path = "httpx/_urls.py", start = 537, end = 550 }, { path = "httpx/_urls.py", start = 582, end = 598 }]
justification = "update and __setitem__ are overridden to raise RuntimeError with the migration message; the supported route is the copy-returning set/add/remove/merge family, and two hard-deprecation tests assert the raise."

[limits]
max_tool_calls        = 20
max_repository_tokens = 30000
wall_clock_s          = 180
