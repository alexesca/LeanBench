id            = "httpx-dev-006"
version       = 1
repository    = "httpx"
commit        = "b5addb64f0161ff6bfe94c124ef76f6a1fba5254"
category      = "api_contract"
difficulty    = "L1"
authored_by   = "claude-opus-5"
reviewed_by   = ""
authored_at   = "2026-09-02"
tags          = ["transports", "testing"]

# --- Agent Track ---------------------------------------------------------
prompt = """
What does the mock transport take as its argument, and what does it do to the request
before calling it?
"""

required_capabilities = ["search", "symbols"]
allowed_tools         = ["candidate.search", "candidate.context", "repo.read_range", "repo.search"]

# --- Retrieval Track -----------------------------------------------------
[[probes]]
paraphrase_id = "literal"
op            = "search"
args          = { query = "MockTransport handler callable read request return Response", limit = 5 }

[[probes]]
paraphrase_id = "intent"
op            = "search"
args          = { query = "how do I substitute canned replies instead of real traffic", limit = 5 }

[[probes]]
paraphrase_id = "symptom"
op            = "search"
args          = { query = "my stub function received a request whose body was already consumed", limit = 5 }

# --- Structured gold -----------------------------------------------------
[gold]
files         = ["httpx/_transports/mock.py"]
symbols       = ["MockTransport", "MockTransport.handle_request", "MockTransport.handle_async_request"]
ranges        = [{ path = "httpx/_transports/mock.py", start = 15, end = 43 }]
justification = "MockTransport takes a single handler callable, reads the request body first (read or aread), and accepts either a plain or an async handler on the async path."

[limits]
max_tool_calls        = 5
max_repository_tokens = 4000
wall_clock_s          = 8
