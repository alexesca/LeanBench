id            = "httpx-test-002"
version       = 1
repository    = "httpx"
commit        = "b5addb64f0161ff6bfe94c124ef76f6a1fba5254"
category      = "tests"
difficulty    = "L3"
authored_by   = "claude-opus-5"
reviewed_by   = ""
authored_at   = "2026-09-02"
tags          = ["exceptions", "dependencies", "invariants"]

# --- Agent Track ---------------------------------------------------------
prompt = """
One test guarantees that the underlying networking dependency cannot introduce an
exception class this package fails to translate. Which test is it, how does it work, and
which source symbol has to be edited when it fails?
"""

required_capabilities = ["search", "tests"]
allowed_tools         = ["candidate.search", "candidate.context", "repo.read_range", "repo.search"]

# --- Retrieval Track -----------------------------------------------------
[[probes]]
paraphrase_id = "literal"
op            = "search"
args          = { query = "test_httpcore_all_exceptions_mapped unmapped exceptions vars httpcore", limit = 10 }

[[probes]]
paraphrase_id = "intent"
op            = "search"
args          = { query = "what stops a dependency upgrade from leaking foreign error types to users", limit = 10 }

[[probes]]
paraphrase_id = "symptom"
op            = "search"
args          = { query = "after upgrading a dependency the suite fails listing unmapped exception names", limit = 10 }

# --- Structured gold -----------------------------------------------------
[gold]
files         = ["httpx/_transports/default.py", "httpx/_exceptions.py"]
symbols       = ["_load_httpcore_exceptions", "HTTPCORE_EXC_MAP"]
tests         = ["tests/test_exceptions.py"]
ranges        = [{ path = "httpx/_transports/default.py", start = 74, end = 92 }]
justification = "test_httpcore_all_exceptions_mapped reflects over vars(httpcore) and vars(httpx) and fails on the set difference; the fix is to extend the dict returned by _load_httpcore_exceptions (and add the httpx class), not the test."

[limits]
max_tool_calls        = 20
max_repository_tokens = 30000
wall_clock_s          = 180
