id            = "httpx-sym-004"
version       = 1
repository    = "httpx"
commit        = "b5addb64f0161ff6bfe94c124ef76f6a1fba5254"
category      = "symbol_location"
difficulty    = "L1"
authored_by   = "claude-opus-5"
reviewed_by   = ""
authored_at   = "2026-09-02"
tags          = ["urls", "limits", "validation"]

# --- Agent Track ---------------------------------------------------------
prompt = """
There is a hard cap on the length of a URL that httpx will accept. Name the constant,
give its value, and name the function that enforces it both for whole URLs and for
individual components.
"""

required_capabilities = ["search", "symbols"]
allowed_tools         = ["candidate.search", "candidate.context", "repo.read_range", "repo.search"]

# --- Retrieval Track -----------------------------------------------------
[[probes]]
paraphrase_id = "literal"
op            = "search"
args          = { query = "MAX_URL_LENGTH urlparse URL too long validation", limit = 10 }

[[probes]]
paraphrase_id = "intent"
op            = "search"
args          = { query = "is there an upper bound on how long an address can be before it is rejected", limit = 10 }

[[probes]]
paraphrase_id = "symptom"
op            = "search"
args          = { query = "InvalidURL: URL too long is raised for a request with a very large query string", limit = 10 }

# --- Structured gold -----------------------------------------------------
[gold]
files         = ["httpx/_urlparse.py"]
symbols       = ["MAX_URL_LENGTH", "urlparse"]
ranges        = [{ path = "httpx/_urlparse.py", start = 29, end = 29 }, { path = "httpx/_urlparse.py", start = 213, end = 290 }]
justification = "MAX_URL_LENGTH = 65536 is declared in _urlparse.py and is checked twice inside urlparse: once for the whole string and once per keyword component."

[limits]
max_tool_calls        = 12
max_repository_tokens = 15000
wall_clock_s          = 120
