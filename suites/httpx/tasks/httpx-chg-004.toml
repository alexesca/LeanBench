id            = "httpx-chg-004"
version       = 1
repository    = "httpx"
commit        = "b5addb64f0161ff6bfe94c124ef76f6a1fba5254"
category      = "change_impact"
difficulty    = "L4"
authored_by   = "claude-opus-5"
reviewed_by   = ""
authored_at   = "2026-09-02"
tags          = ["encoding", "models", "impact"]

# --- Agent Track ---------------------------------------------------------
prompt = """
If the rule that decides the character set of a response's decoded text changed, which
symbols and tests would be affected? Include the path by which the per-client default
reaches the response object.
"""

required_capabilities = ["search", "symbols", "references", "tests"]
allowed_tools         = ["candidate.search", "candidate.context", "repo.read_range", "repo.search"]

# --- Retrieval Track -----------------------------------------------------
[[probes]]
paraphrase_id = "literal"
op            = "search"
args          = { query = "Response encoding charset_encoding default_encoding autodetect impact", limit = 10 }

[[probes]]
paraphrase_id = "intent"
op            = "search"
args          = { query = "what would have to be revisited if the way text is decoded were reworked", limit = 10 }

[[probes]]
paraphrase_id = "symptom"
op            = "search"
args          = { query = "the decoded body is mojibake whenever the server omits a charset in its content type", limit = 10 }

# --- Structured gold -----------------------------------------------------
[gold]
files         = ["httpx/_models.py", "httpx/_client.py"]
symbols       = ["Response.encoding", "Response.charset_encoding", "Response.text", "Client._send_single_request", "BaseClient.__init__"]
tests         = ["tests/client/test_client.py", "tests/test_decoders.py"]
docs          = ["docs/advanced/text-encodings.md"]
ranges        = [{ path = "httpx/_models.py", start = 641, end = 697 }, { path = "httpx/_client.py", start = 1001, end = 1034 }, { path = "httpx/_client.py", start = 188, end = 221 }]
justification = "Response.encoding implements the three-step priority and feeds Response.text via TextDecoder; the per-client value is not passed to the constructor but assigned in _send_single_request from BaseClient's default_encoding, which is the non-obvious link, and the autodetect and explicit-encoding client tests pin the behaviour."

[limits]
max_tool_calls        = 20
max_repository_tokens = 30000
wall_clock_s          = 180
