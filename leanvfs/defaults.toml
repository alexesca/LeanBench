# LeanVFS built-in defaults.
# EVERY consequential parameter lives here. Nothing consequential is a Python constant.
# Layering (highest wins): this file -> /etc/leanvfs/config.toml ->
#   ~/.config/leanvfs/config.toml -> <repo>/.leanvfs.toml -> <repo>/.leanvfs.local.toml -> CLI flags

[general]
profile = "balanced"
workers = 4
state_dir = ""
data_dir = ""

[discovery]
include = ["**/*"]
exclude = [
  "**/.git/**", "**/.hg/**", "**/.svn/**",
  "**/node_modules/**", "**/.venv/**", "**/venv/**",
  "**/__pycache__/**", "**/*.pyc", "**/.mypy_cache/**",
  "**/.pytest_cache/**", "**/.ruff_cache/**", "**/dist/**",
  "**/build/**", "**/*.egg-info/**", "**/.tox/**",
]
max_file_bytes = 2097152
follow_symlinks = false
max_depth = 32
binary_sniff_bytes = 4096

[classification]
# ordered rules: first match wins. glob (on repo-relative posix path) -> file_class
rules = [
  ["**/.github/workflows/**", "ci"],
  ["**/.gitlab-ci.yml", "ci"],
  ["**/azure-pipelines.yml", "ci"],
  ["**/Dockerfile*", "deployment"],
  ["**/docker-compose*.y*ml", "deployment"],
  ["**/k8s/**", "deployment"],
  ["**/migrations/**", "migration"],
  ["**/alembic/versions/**", "migration"],
  ["**/schema.sql", "schema"],
  ["**/*.proto", "schema"],
  ["**/*.graphql", "schema"],
  ["**/scripts/**", "script"],
  ["**/pyproject.toml", "build"],
  ["**/setup.py", "build"],
  ["**/setup.cfg", "build"],
  ["**/requirements*.txt", "build"],
  ["**/Makefile", "build"],
  ["**/package.json", "build"],
  ["**/Cargo.toml", "build"],
  ["**/mkdocs.yml", "build"],
  ["**/docs/adr/**", "architecture"],
  ["**/docs/architecture/**", "architecture"],
  ["**/docs/design/**", "architecture"],
  ["**/adr/**", "architecture"],
  ["**/tests/e2e/**", "test.e2e"],
  ["**/tests/integration/**", "test.integration"],
  ["**/test_*.py", "test.unit"],
  ["**/*_test.py", "test.unit"],
  ["**/tests/**/*.py", "test.unit"],
  ["**/conftest.py", "test.unit"],
  ["**/*.md", "documentation"],
  ["**/*.rst", "documentation"],
  ["**/*.txt", "documentation"],
  ["**/*.toml", "configuration"],
  ["**/*.yaml", "configuration"],
  ["**/*.yml", "configuration"],
  ["**/*.json", "configuration"],
  ["**/*.ini", "configuration"],
  ["**/*.cfg", "configuration"],
  ["**/.env.example", "configuration"],
  ["**/*.py", "source"],
]
# substring markers that upgrade a test file's class
integration_markers = ["integration"]
e2e_markers = ["e2e", "end_to_end", "endtoend"]
generated_markers = ["@generated", "DO NOT EDIT", "autogenerated", "Code generated by"]
generated_scan_bytes = 2048

[languages]
# extension -> language id
map = { ".py" = "python", ".pyi" = "python", ".md" = "markdown", ".rst" = "markdown", ".toml" = "toml", ".yaml" = "yaml", ".yml" = "yaml", ".json" = "json", ".ini" = "ini", ".cfg" = "ini", ".txt" = "text", ".sh" = "shell" }
rich_adapters = ["python"]

[hashing]
algorithm = "blake2b"
digest_bytes = 16

[keywords]
idf_refresh = "sync"          # sync | never | drift
idf_drift_threshold = 0.15
max_per_symbol = 8
max_per_file = 15
min_term_length = 3
max_term_length = 40
lowercase = true
split_identifiers = true
stoplist = [
  "the", "and", "for", "with", "that", "this", "from", "into", "your", "you",
  "are", "was", "were", "not", "but", "any", "all", "can", "has", "have", "will",
  "use", "used", "using", "get", "set", "new", "old", "add", "run", "one", "two",
  "when", "then", "else", "true", "false", "none", "null", "self", "cls", "args",
  "kwargs", "value", "values", "data", "item", "items", "type", "types", "obj",
  "object", "str", "int", "bool", "float", "dict", "list", "tuple", "bytes",
  "return", "returns", "returned", "param", "params", "arg", "func", "function",
  "method", "class", "module", "test", "tests", "should", "must", "may",
]
language_keywords = [
  "def", "async", "await", "import", "lambda", "yield", "raise", "except",
  "finally", "while", "elif", "pass", "global", "nonlocal", "assert", "del",
]
[keywords.structural_weights]
symbol_name = 3.0
qualified_name = 2.0
class_name = 2.0
module_name = 1.5
parameter = 1.2
type_use = 1.4
return_type = 1.4
call_target = 1.3
exception = 1.6
decorator = 1.1
docstring = 1.0
literal = 0.6
member_access = 0.8
heading = 2.0

[calls]
max_per_symbol = 10
record_builtins = false
trivial_builtins = [
  "len", "print", "str", "int", "float", "bool", "list", "dict", "set", "tuple",
  "range", "enumerate", "zip", "map", "filter", "sorted", "reversed", "sum",
  "min", "max", "abs", "round", "isinstance", "issubclass", "getattr", "setattr",
  "hasattr", "type", "repr", "format", "iter", "next", "super", "id", "hash",
  "append", "extend", "pop", "keys", "keys", "values", "items", "join", "split",
  "strip", "lower", "upper", "startswith", "endswith", "replace", "copy", "get",
]

[side_effects]
propagate_hops = 1
propagate_transitive = false
# vocabulary: db:r db:w fs:r fs:w http queue:publish queue:consume cache:r cache:w
#             subprocess crypto email env:r clock random
# pattern (regex, matched against resolved/raw call target, case-insensitive) -> effect
patterns = [
  ["\\b(select|fetchall|fetchone|find_by|find_one|get_by|query|filter_by|all)\\b", "db:r"],
  ["\\b(insert|update|delete|commit|save|create|bulk_save|upsert|flush)\\b", "db:w"],
  ["\\b(open|read_text|read_bytes|readlines|read|iterdir|glob|stat|exists)\\b", "fs:r"],
  ["\\b(write_text|write_bytes|writelines|mkdir|makedirs|unlink|rmtree|rename|touch)\\b", "fs:w"],
  ["\\b(request|send|urlopen|httpx|requests|aiohttp|fetch|post|put|patch|head|options)\\b", "http"],
  ["\\b(publish|enqueue|produce|send_message|apply_async|delay)\\b", "queue:publish"],
  ["\\b(consume|subscribe|receive_message|basic_consume)\\b", "queue:consume"],
  ["\\b(cache_get|memcache_get|redis_get|cache\\.get)\\b", "cache:r"],
  ["\\b(cache_set|redis_set|cache\\.set|expire)\\b", "cache:w"],
  ["\\b(subprocess|popen|check_output|check_call|system|spawn|exec)\\b", "subprocess"],
  ["\\b(hashlib|hmac|encrypt|decrypt|sign|verify|bcrypt|pbkdf2|blake2b|sha256|md5|digest)\\b", "crypto"],
  ["\\b(send_mail|sendmail|send_email|smtp)\\b", "email"],
  ["\\b(getenv|environ|environb)\\b", "env:r"],
  ["\\b(now|utcnow|time|monotonic|perf_counter|sleep)\\b", "clock"],
  ["\\b(random|randint|choice|shuffle|uuid4|token_bytes|token_hex|urandom)\\b", "random"],
]

[comments]
keep_classes = ["rationale", "invariant", "warning", "security", "performance", "business_rule"]
drop_classes = ["todo", "fixme", "ordinary", "workaround"]
min_length = 12
max_length = 240
max_per_symbol = 4
[comments.patterns]
rationale = ["\\bbecause\\b", "\\breason\\b", "\\bwhy\\b", "\\brationale\\b", "\\bso that\\b", "\\bin order to\\b", "\\bthis is why\\b", "\\bintentionally\\b", "\\bdeliberately\\b"]
invariant = ["\\bmust always\\b", "\\bmust never\\b", "\\binvariant\\b", "\\balways\\b", "\\bnever\\b", "\\bguarantee", "\\bensures?\\b", "\\brequired to\\b"]
warning = ["\\bwarning\\b", "\\bcareful\\b", "\\bbeware\\b", "\\bcaution\\b", "\\bdo not\\b", "\\bdon't\\b", "\\bgotcha\\b", "\\bnote that\\b", "\\bimportant\\b"]
security = ["\\bsecurity\\b", "\\bauth\\b", "\\bcredential", "\\bsecret\\b", "\\binject", "\\bsanitiz", "\\bescap", "\\bcsrf\\b", "\\bxss\\b", "\\bprivile"]
performance = ["\\bperformance\\b", "\\bslow\\b", "\\bfast(er)?\\b", "\\boptimi[sz]", "\\bcache\\b", "\\bO\\(", "\\bhot path\\b", "\\bexpensive\\b"]
business_rule = ["\\bbusiness\\b", "\\bpolicy\\b", "\\bper spec\\b", "\\brule\\b", "\\brfc ?\\d+", "\\bspec(ification)?\\b"]
workaround = ["\\bworkaround\\b", "\\bhack\\b", "\\bkludge\\b", "\\btemporary\\b", "\\bbug in\\b"]
todo = ["^todo\\b", "\\btodo:", "\\bxxx\\b"]
fixme = ["^fixme\\b", "\\bfixme:", "\\bhack:"]

[docs]
elevated_names = ["README", "SECURITY", "CONTRIBUTING", "AGENTS", "CLAUDE", "CHANGELOG", "ARCHITECTURE"]
elevated_globs = ["docs/architecture/**", "docs/design/**", "docs/adr/**", "docs/security/**", "docs/runbooks/**"]
max_headings = 40
max_concepts = 20
max_links = 20
excerpt_chars = 200
adr_patterns = ["^ADR-", "^\\d{4}-"]

[config_extract]
max_keys = 120
max_value_chars = 60
max_depth = 6

[resolution]
max_ambiguous = 3
tier_confidence = { R0 = 1.0, R1 = 0.9, R2 = 0.7, R3 = 0.5, R4 = 0.3 }
emit_unresolved = true
test_priority = true
max_refs_per_symbol = 200

[budget]
default_file_tokens = 1200
default_context_tokens = 400
default_search_tokens = 800
default_response_tokens = 2000
tokens_per_char = 0.27
token_floor = 1
report_drops = true
# per-kind caps applied before the global budget
[budget.per_kind_caps]
keyword = 15
call = 10
parameter = 24
side_effect = 8
exception = 8
test_expectation = 6
documentation = 6
type_use = 12
comment_note = 4
config_key = 30
[budget.context_order]
# assembly order for get_context AFTER mandatory identity fields. CONFIG, not code.
order = ["exception", "side_effect", "invariant", "security_note", "warning", "test_expectation", "call", "documentation", "keyword", "type_use", "parameter"]

[priorities]
# fact kind -> priority in the ladder (P0..P4). Registry reads these.
signature = 0
parameter = 0
return_type = 0
return_shape = 0
invariant = 0
security_note = 0
test_expectation = 0
call = 1
side_effect = 1
exception = 1
route = 1
architecture_decision = 1
purpose = 1
config_key = 1
keyword = 2
test_fixture = 2
test_mock = 2
test_case = 2
documentation = 2
rationale = 2
resource = 2
type_use = 2
warning = 2
performance_note = 2
framework_metadata = 3
comment_note = 3

[search]
limit_default = 10
limit_max = 100
snippet_chars = 160
fts_candidates = 400
[search.weights]
bm25 = 1.0
exact_symbol = 4.0
qualified_symbol = 3.0
path = 1.2
keyword = 1.0
class_source = 1.0
class_tests = 0.8
class_docs = 0.7
recency = 0.0

[affected]
max_depth = 3
max_results = 100
likely_threshold = 0.5
edge_kinds = ["REFERENCES", "USES_TYPE", "IMPLEMENTS", "EXTENDS", "IMPORTS", "CALLS", "TESTS"]

[render]
renderer = "compact"
show_keywords = true
show_calls = true
show_effects = true
show_notes = true
max_symbols_per_file = 400
indent = "  "

[mirror]
enabled = false
dir = "mirror"

[incremental]
debounce_ms = 75
source_cache_entries = 256
tree_cache_entries = 128
enable_tree_reuse = true

[redaction]
enabled = true
entropy_threshold = 4.0
entropy_min_length = 20
max_value_chars = 200
key_patterns = ["password", "passwd", "secret", "token", "api_key", "apikey", "private_key", "privatekey", "credential", "connection_string", "connectionstring", "access_key", "auth", "session_key", "encryption_key", "dsn"]
provider_prefixes = ["sk-", "ghp_", "gho_", "ghu_", "ghs_", "ghr_", "github_pat_", "AKIA", "ASIA", "xoxb-", "xoxp-", "AIza", "ya29.", "SG.", "npm_"]
value_patterns = [
  "-----BEGIN [A-Z ]*PRIVATE KEY-----",
  "-----BEGIN [A-Z ]*KEY-----",
  "\\beyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{4,}",
  "\\b[a-z][a-z0-9+.-]*://[^\\s:@/]+:[^\\s:@/]+@",
]
placeholder = "<redacted>"

[server]
max_line_bytes = 4194304
max_query_chars = 2000
default_format = "compact"

[stats]
enabled = true

# ---------------------------------------------------------------------------
# Profiles: complete config presets applied over the defaults when selected.
# ---------------------------------------------------------------------------
[profiles.minimal]
"budget.default_file_tokens" = 400
"budget.default_context_tokens" = 180
"keywords.max_per_symbol" = 3
"keywords.max_per_file" = 6
"calls.max_per_symbol" = 3
"render.show_notes" = false
"comments.keep_classes" = ["invariant", "security"]

[profiles.aggressive]
"budget.default_file_tokens" = 700
"budget.default_context_tokens" = 250
"keywords.max_per_symbol" = 5
"keywords.max_per_file" = 10
"calls.max_per_symbol" = 6

[profiles.balanced]

[profiles.rich]
"budget.default_file_tokens" = 3000
"budget.default_context_tokens" = 900
"keywords.max_per_symbol" = 12
"keywords.max_per_file" = 25
"calls.max_per_symbol" = 16
"side_effects.propagate_transitive" = true

[profiles.tests]
"budget.default_file_tokens" = 900
"keywords.max_per_symbol" = 5
"calls.max_per_symbol" = 4

# Per-glob path rules. Declared in user config as:
#   [[rules]]
#   match = "tests/**"
#   profile = "tests"
# Built-in default is the empty list (see config.py DEFAULT_PATH_RULES).
