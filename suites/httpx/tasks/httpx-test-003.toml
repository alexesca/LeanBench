id            = "httpx-test-003"
version       = 1
repository    = "httpx"
commit        = "b5addb64f0161ff6bfe94c124ef76f6a1fba5254"
category      = "tests"
difficulty    = "L1"
authored_by   = "claude-opus-5"
reviewed_by   = ""
authored_at   = "2026-09-02"
tags          = ["fixtures", "integration"]

# --- Agent Track ---------------------------------------------------------
prompt = """
Some tests make real HTTP calls against a locally started server. Where is that server
defined, what scope does the fixture have, and how is it run without blocking the test
process?
"""

required_capabilities = ["search", "tests"]
allowed_tools         = ["candidate.search", "candidate.context", "repo.read_range", "repo.search"]

# --- Retrieval Track -----------------------------------------------------
[[probes]]
paraphrase_id = "literal"
op            = "search"
args          = { query = "conftest TestServer pytest fixture session scope serve_in_thread", limit = 10 }

[[probes]]
paraphrase_id = "intent"
op            = "search"
args          = { query = "how do the tests that need a real socket obtain something to talk to", limit = 10 }

[[probes]]
paraphrase_id = "symptom"
op            = "search"
args          = { query = "running one test file alone gives connection refused for a localhost address", limit = 10 }

# --- Structured gold -----------------------------------------------------
[gold]
files         = ["tests/conftest.py"]
symbols       = ["TestServer", "server", "serve_in_thread"]
tests         = ["tests/conftest.py"]
ranges        = [{ path = "tests/conftest.py", start = 224, end = 268 }, { path = "tests/conftest.py", start = 271, end = 280 }, { path = "tests/conftest.py", start = 283, end = 287 }]
justification = "tests/conftest.py subclasses the uvicorn Server as TestServer, exposes a session-scoped 'server' fixture, and serve_in_thread starts it on a background thread and joins it on teardown."

[limits]
max_tool_calls        = 12
max_repository_tokens = 15000
wall_clock_s          = 120
