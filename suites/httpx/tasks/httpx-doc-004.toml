id            = "httpx-doc-004"
version       = 1
repository    = "httpx"
commit        = "b5addb64f0161ff6bfe94c124ef76f6a1fba5254"
category      = "documentation"
difficulty    = "L3"
authored_by   = "claude-opus-5"
reviewed_by   = ""
authored_at   = "2026-09-02"
tags          = ["timeouts", "extensions", "docs"]

# --- Agent Track ---------------------------------------------------------
prompt = """
The documentation presents request timeouts as one instance of a more general mechanism.
Which mechanism is that, which page documents it, and which source symbols write and
read the relevant key?
"""

required_capabilities = ["search", "docs", "symbols"]
allowed_tools         = ["candidate.search", "candidate.context", "repo.read_range", "repo.search"]

# --- Retrieval Track -----------------------------------------------------
[[probes]]
paraphrase_id = "literal"
op            = "search"
args          = { query = "extensions timeout key documentation connect read write pool dictionary", limit = 10 }

[[probes]]
paraphrase_id = "intent"
op            = "search"
args          = { query = "how can I attach a per-call duration limit without constructing a configuration object", limit = 10 }

[[probes]]
paraphrase_id = "symptom"
op            = "search"
args          = { query = "I see a dictionary of durations riding along on the request object and want to know why", limit = 10 }

# --- Structured gold -----------------------------------------------------
[gold]
files         = ["httpx/_client.py", "httpx/_config.py", "httpx/_transports/default.py"]
symbols       = ["BaseClient._set_timeout", "Timeout.as_dict", "HTTPTransport.handle_request"]
docs          = ["docs/advanced/extensions.md", "docs/advanced/timeouts.md"]
ranges        = [{ path = "httpx/_client.py", start = 584, end = 591 }, { path = "httpx/_config.py", start = 132, end = 138 }, { path = "httpx/_transports/default.py", start = 230, end = 259 }]
justification = "docs/advanced/extensions.md documents request extensions and says explicitly that the timeout extension is how httpx timeouts are implemented; _set_timeout and build_request write it from Timeout.as_dict, and HTTPTransport.handle_request forwards request.extensions to httpcore unchanged."

[limits]
max_tool_calls        = 20
max_repository_tokens = 30000
wall_clock_s          = 180
