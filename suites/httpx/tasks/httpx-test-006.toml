id            = "httpx-test-006"
version       = 1
repository    = "httpx"
commit        = "b5addb64f0161ff6bfe94c124ef76f6a1fba5254"
category      = "tests"
difficulty    = "L3"
authored_by   = "claude-opus-5"
reviewed_by   = ""
authored_at   = "2026-09-02"
tags          = ["config", "timeouts", "change-impact"]

# --- Agent Track ---------------------------------------------------------
prompt = """
If the timeout configuration object stopped accepting a four-tuple, which tests would
have to change, and which single module carries essentially all of the coverage for that
object?
"""

required_capabilities = ["search", "tests", "references"]
allowed_tools         = ["candidate.search", "candidate.context", "repo.read_range", "repo.search"]

# --- Retrieval Track -----------------------------------------------------
[[probes]]
paraphrase_id = "literal"
op            = "search"
args          = { query = "test_config timeout from tuple four values assertions", limit = 10 }

[[probes]]
paraphrase_id = "intent"
op            = "search"
args          = { query = "where are the assertions that pass a sequence of four durations", limit = 10 }

[[probes]]
paraphrase_id = "symptom"
op            = "search"
args          = { query = "I want to drop sequence support and need to know what will break in the suite", limit = 10 }

# --- Structured gold -----------------------------------------------------
[gold]
files         = ["httpx/_config.py"]
symbols       = ["Timeout.__init__"]
tests         = ["tests/test_config.py"]
ranges        = [{ path = "httpx/_config.py", start = 86, end = 130 }]
justification = "tests/test_config.py is the only module that constructs the object from tuples (the from_tuple, one_value_and_default and all_parameters_set cases plus the equality checks); the source branch is the isinstance(timeout, tuple) arm."

[limits]
max_tool_calls        = 20
max_repository_tokens = 30000
wall_clock_s          = 180
