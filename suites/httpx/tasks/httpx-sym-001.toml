id            = "httpx-sym-001"
version       = 1
repository    = "httpx"
commit        = "b5addb64f0161ff6bfe94c124ef76f6a1fba5254"
category      = "symbol_location"
difficulty    = "L2"
authored_by   = "claude-opus-5"
reviewed_by   = ""
authored_at   = "2026-09-02"
tags          = ["urls", "parsing", "ports"]

# --- Agent Track ---------------------------------------------------------
prompt = """
When a URL is written with the standard port for its scheme, httpx does not keep the
port. Which function performs that normalization, where is the table of default ports it
consults, and which parsing entry point calls it?
"""

required_capabilities = ["search", "symbols"]
allowed_tools         = ["candidate.search", "candidate.context", "repo.read_range", "repo.search"]

# --- Retrieval Track -----------------------------------------------------
[[probes]]
paraphrase_id = "literal"
op            = "search"
args          = { query = "normalize_port default port scheme normalization urlparse", limit = 10 }

[[probes]]
paraphrase_id = "intent"
op            = "search"
args          = { query = "where does the library decide a port number can be dropped from an address", limit = 10 }

[[probes]]
paraphrase_id = "symptom"
op            = "search"
args          = { query = "two addresses that differ only by :443 compare as equal and .port comes back as nothing", limit = 10 }

# --- Structured gold -----------------------------------------------------
[gold]
files         = ["httpx/_urlparse.py"]
symbols       = ["normalize_port", "urlparse"]
ranges        = [{ path = "httpx/_urlparse.py", start = 395, end = 419 }, { path = "httpx/_urlparse.py", start = 213, end = 345 }]
relationships = [["urlparse", "CALLS", "normalize_port"]]
justification = "The default-port table and the drop rule live only in normalize_port, which urlparse calls when building ParseResult; URL.port merely reads the already normalized value, so the client-side _port_or_default helper is a distractor."

[limits]
max_tool_calls        = 20
max_repository_tokens = 30000
wall_clock_s          = 180
