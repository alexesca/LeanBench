[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leanbench"
version = "0.1.0"
description = "LeanBench — local-first benchmark for repository-intelligence systems"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "typer>=0.9",
    "psutil>=5.9",
]

[project.optional-dependencies]
tokenizers = ["tiktoken>=0.5"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
leanbench = "leanbench.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
leanbench = ["config/*.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["fixtures/mini-repo"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RET", "ARG", "PTH", "E722", "T20"]
ignore = ["B008", "SIM108", "RET504"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
"fixtures/fake-candidate/*" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:leanbench.*"]
