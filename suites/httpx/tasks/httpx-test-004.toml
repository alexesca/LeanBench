id            = "httpx-test-004"
version       = 1
repository    = "httpx"
commit        = "b5addb64f0161ff6bfe94c124ef76f6a1fba5254"
category      = "tests"
difficulty    = "L3"
authored_by   = "claude-opus-5"
reviewed_by   = ""
authored_at   = "2026-09-02"
tags          = ["transports", "testing", "redirects"]

# --- Agent Track ---------------------------------------------------------
prompt = """
How does the test suite exercise redirect handling with no network involved? Identify
the transport class used, the handler function that fabricates the responses, and where
that class lives in the package.
"""

required_capabilities = ["search", "symbols", "tests"]
allowed_tools         = ["candidate.search", "candidate.context", "repo.read_range", "repo.search"]

# --- Retrieval Track -----------------------------------------------------
[[probes]]
paraphrase_id = "literal"
op            = "search"
args          = { query = "MockTransport handler function tests redirects fabricate responses", limit = 10 }

[[probes]]
paraphrase_id = "intent"
op            = "search"
args          = { query = "how are the intermediate hops produced when no server is running", limit = 10 }

[[probes]]
paraphrase_id = "symptom"
op            = "search"
args          = { query = "these tests assert on 301 and 302 responses but nothing appears to listen on a port", limit = 10 }

# --- Structured gold -----------------------------------------------------
[gold]
files         = ["httpx/_transports/mock.py"]
symbols       = ["MockTransport", "MockTransport.handle_request", "MockTransport.handle_async_request"]
tests         = ["tests/client/test_redirects.py"]
ranges        = [{ path = "httpx/_transports/mock.py", start = 15, end = 43 }]
justification = "MockTransport in httpx/_transports/mock.py wraps a plain callable and is what the redirect tests install; the module-level 'redirects' handler in tests/client/test_redirects.py maps paths onto synthetic Response objects."

[limits]
max_tool_calls        = 20
max_repository_tokens = 30000
wall_clock_s          = 180
